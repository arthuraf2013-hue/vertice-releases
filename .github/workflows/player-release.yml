name: Vértice Player — publicar versão nova

# Como lançar: faça um commit cuja mensagem comece com "release:" (ex.: "release: menu do
# operador") e dê push na main. Este workflow então:
#   1. roda os testes e sobe a versão do player (0.3.1 → 0.3.2) num commit "[skip release]";
#   2. gera o instalador do Windows (no Windows) e o APK + o pacote de conteúdo (no Linux);
#   3. publica tudo numa release do GitHub com o player-update.json.
# As TVs leem o player-update.json da última release e se atualizam sozinhas:
#   - Windows: baixa o instalador e instala em silêncio;
#   - Android: o conteúdo novo entra sem reinstalar; o APK só é reinstalado quando a parte
#     nativa mudou (scripts/player-manifest.mjs decide isso comparando com a versão anterior).
#
# Configuração única (Settings › Secrets and variables › Actions › New repository secret):
#   PLAYER_ENV              conteúdo inteiro do arquivo apps/player/.env (config do Firebase)
#   ANDROID_KEYSTORE_BASE64 apps/player/android/app/vertice-debug.keystore em base64
#     (a MESMA chave assina todas as versões; sem ela o Android não aceita a atualização)
# O repositório precisa ser público para as TVs baixarem sem senha.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-release
  cancel-in-progress: false

jobs:
  versao:
    name: Testes e versão
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.head_commit.message, 'release:') && !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versao.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Conferir os segredos
        env:
          PLAYER_ENV: ${{ secrets.PLAYER_ENV }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAYER_ENV" ]; then echo "::error::Falta o secret PLAYER_ENV (conteúdo do apps/player/.env)."; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::Falta o secret ANDROID_KEYSTORE_BASE64 (chave do APK): a versão sai sem APK novo."; fi

      - run: npm ci

      - name: Testes (regras de versão e atualização)
        run: |
          npm test
          node --test apps/player/electron/updater.test.cjs

      - name: Testes das regras do Firestore
        run: npx firebase emulators:exec --only firestore --project demo-vertice "node --test firebase/tests/rules.test.mjs"

      - name: Subir a versão do player
        id: versao
        run: node scripts/player-version.mjs bump >> "$GITHUB_OUTPUT"

      - name: Commit e tag da versão
        id: commit
        run: |
          V="${{ steps.versao.outputs.version }}"
          git config user.name "vertice-bot"
          git config user.email "actions@github.com"
          git add apps/player/package.json package-lock.json apps/player/android/app/build.gradle
          git commit -m "chore(release): player v$V [skip release]"
          # Alguém deu push enquanto os testes rodavam: põe o commit da versão por cima.
          git pull --rebase origin main
          git tag "v$V"
          git push origin HEAD:main
          git push origin "v$V"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Instalador do Windows
    needs: versao
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versao.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configuração do Firebase
        shell: bash
        env:
          PLAYER_ENV: ${{ secrets.PLAYER_ENV }}
        run: printf '%s\n' "$PLAYER_ENV" | tr -d '\r' > apps/player/.env

      - run: npm ci

      - name: Gerar o instalador
        run: npm run electron:build -w @vertice/player

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/player/release/Vertice-Player-Setup-${{ needs.versao.outputs.version }}.exe
          if-no-files-found: error

  android:
    name: APK e pacote de conteúdo
    needs: versao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versao.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configuração do Firebase
        env:
          PLAYER_ENV: ${{ secrets.PLAYER_ENV }}
        run: |
          # Texto copiado no Windows (Set-Clipboard) chega com \r e quebra de linha no fim: tira antes de usar.
          printf '%s\n' "$PLAYER_ENV" | tr -d '\r' > apps/player/.env
          grep -q '^VITE_' apps/player/.env || { echo "::error::O secret PLAYER_ENV não tem as linhas VITE_ do apps/player/.env."; exit 1; }

      - name: Chave do APK
        id: chave
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Sem a chave certa, esta versão sai sem APK novo, mas o conteúdo das TVs Android e o
          # instalador do Windows saem assim mesmo (a chave não segura a atualização de ninguém).
          K=apps/player/android/app/vertice-debug.keystore
          # Texto colado pode trazer sujeira invisível (espaço não separável, BOM, aspas) ou as linhas
          # "-----BEGIN/END-----" do certutil: fica só o que é base64. O keytool confere a chave.
          B64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r' | sed '/-----/d' | tr -cd 'A-Za-z0-9+/=')
          while [ $(( ${#B64} % 4 )) -ne 0 ]; do B64="$B64="; done
          echo "Chave do APK: ${#ANDROID_KEYSTORE_BASE64} caracteres no secret, ${#B64} depois de limpar (a certa dá 3576)."
          if printf '%s' "$B64" | base64 -d > "$K" 2>/dev/null \
             && keytool -list -keystore "$K" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "Impressão da chave (sha256): $(sha256sum "$K" | cut -c1-16) (a certa: 6fe4b187e02fcfe4)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$K"
            echo "::warning::A chave do APK (secret ANDROID_KEYSTORE_BASE64) não abriu. Esta versão sai sem APK novo; o conteúdo das TVs Android e o Windows saem normalmente. Cole de novo a chave no secret."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Conteúdo do player (vai para as TVs Android sem reinstalar)
        working-directory: apps/player
        run: |
          npx vite build || { echo "::error::O build do player (vite) falhou."; exit 1; }
          npx cap sync android || { echo "::error::cap sync android falhou."; exit 1; }

      - name: Android SDK
        if: steps.chave.outputs.ok == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null \
            || { echo "::error::Não consegui instalar o Android SDK 36 no runner."; exit 1; }

      - name: Gerar o APK
        if: steps.chave.outputs.ok == 'true'
        id: apk
        continue-on-error: true
        working-directory: apps/player/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || { echo "::warning::O Gradle não gerou o APK; a versão sai sem APK novo (ver o log deste passo)."; exit 1; }

      - name: Juntar os arquivos
        run: |
          V="${{ needs.versao.outputs.version }}"
          mkdir -p out
          A=apps/player/android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$A" ]; then cp "$A" "out/Vertice-Player-$V.apk"; fi
          # O pacote de conteúdo é exatamente o que vai dentro do APK (assets/public).
          (cd apps/player/android/app/src/main/assets/public && zip -qr -X "$GITHUB_WORKSPACE/out/vertice-player-web-$V.zip" .)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  publicar:
    name: Publicar a release
    needs: [versao, windows, android]
    # Publica o que deu certo: Windows sem Android, ou Android sem Windows, já atualiza aquelas TVs.
    if: ${{ always() && needs.versao.result == 'success' && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versao.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist-release
          merge-multiple: true

      - name: Manifesto de atualização
        env:
          NOTAS: ${{ github.event.head_commit.message }}
        run: |
          V="${{ needs.versao.outputs.version }}"
          # Manifesto da versão anterior: decide se o APK precisa ser reinstalado.
          curl -fsSL -o anterior.json "https://github.com/${{ github.repository }}/releases/latest/download/player-update.json" \
            || curl -fsSL -o anterior.json "https://raw.githubusercontent.com/${{ github.repository }}/updates/player-update.json" \
            || rm -f anterior.json
          node scripts/player-manifest.mjs "$V" dist-release "${{ github.repository }}" "$NOTAS" anterior.json

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ github.event.head_commit.message }}
        run: |
          V="${{ needs.versao.outputs.version }}"
          gh release create "v$V" dist-release/* --title "Vértice Player $V" --notes "${NOTAS:-Versão $V}" --latest

      - name: Espelho das atualizações (ramo updates)
        continue-on-error: true
        run: |
          # Segundo e terceiro caminho para as TVs: raw.githubusercontent.com e jsDelivr servem este ramo.
          # Só o manifesto e os arquivos pequenos (o instalador do Windows fica só na release).
          V="${{ needs.versao.outputs.version }}"
          mkdir espelho
          cp dist-release/player-update.json espelho/
          for f in "vertice-player-web-$V.zip" "Vertice-Player-$V.apk"; do
            if [ -f "dist-release/$f" ] && [ "$(stat -c%s "dist-release/$f")" -lt 95000000 ]; then cp "dist-release/$f" espelho/; fi
          done
          cd espelho
          git init -q -b updates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Atualização $V"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" updates
          # O jsDelivr guarda cópia por até 12 h: pede para renovar o manifesto agora.
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@updates/player-update.json" > /dev/null || true
